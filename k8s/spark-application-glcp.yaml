apiVersion: "sparkoperator.k8s.io/v1beta2"
kind: SparkApplication
metadata:
  name: spark-delta-glcp-app
  namespace: spark-apps
spec:
  type: Scala
  mode: cluster
  # GLCP Container Registry image path
  # Important: Use specific version tags instead of 'latest' for production
  image: "containers.us1.greenlakecloud.hpe.com/your-org-id/default/pa-spark:1.0.0"
  imagePullPolicy: Always
  imagePullSecrets:
    - glcp-registry-secret
  mainClass: com.opsramp.spark.S3ToDeltaLakeApp
  mainApplicationFile: "local:///opt/spark-app/jobs/s3-to-delta-assembly.jar"
  arguments:
    # Update with your GCS or S3 paths
    - "gs://your-source-bucket/input-data/"
    - "gs://your-destination-bucket/delta-table/"
    - "parquet"
  sparkVersion: "3.5.0"
  restartPolicy:
    type: OnFailure
    onFailureRetries: 3
    onFailureRetryInterval: 10
    onSubmissionFailureRetries: 5
    onSubmissionFailureRetryInterval: 20

  # Spark configurations
  sparkConf:
    # Delta Lake configurations
    "spark.sql.extensions": "io.delta.sql.DeltaSparkSessionExtension"
    "spark.sql.catalog.spark_catalog": "org.apache.spark.sql.delta.catalog.DeltaCatalog"
    
    # GCS configurations (if using Google Cloud Storage)
    "spark.hadoop.fs.gs.impl": "com.google.cloud.hadoop.fs.gcs.GoogleHadoopFileSystem"
    "spark.hadoop.fs.AbstractFileSystem.gs.impl": "com.google.cloud.hadoop.fs.gcs.GoogleHadoopFS"
    
    # Or S3 configurations (if using AWS S3)
    # "spark.hadoop.fs.s3a.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem"
    # "spark.hadoop.fs.s3a.aws.credentials.provider": "com.amazonaws.auth.WebIdentityTokenCredentialsProvider"

    # Performance tuning
    "spark.sql.adaptive.enabled": "true"
    "spark.sql.adaptive.coalescePartitions.enabled": "true"
    "spark.serializer": "org.apache.spark.serializer.KryoSerializer"

    # Event logging (optional - for Spark History Server)
    "spark.eventLog.enabled": "true"
    "spark.eventLog.dir": "gs://your-bucket/spark-events/"

  # Driver configuration
  driver:
    cores: 1
    coreLimit: "1200m"
    memory: "2g"
    labels:
      version: "3.5.0"
    serviceAccount: spark-service-account
    env:
      - name: CLOUD_PROVIDER
        value: "glcp"

  # Executor configuration
  executor:
    cores: 2
    instances: 2
    memory: "4g"
    labels:
      version: "3.5.0"
    env:
      - name: CLOUD_PROVIDER
        value: "glcp"

  # Dynamic allocation (optional)
  dynamicAllocation:
    enabled: true
    initialExecutors: 2
    minExecutors: 1
    maxExecutors: 10
